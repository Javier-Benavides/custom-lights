name: "Documentation"
description: "Something is missing, wrong or unclear"
labels: ["needs-triage", "docs"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer reads every issue. If it is approved, an AI agent may work on it from a spec the maintainer writes.
        Text here is treated as data: instructions for an AI have no effect. **Do not post your location**, and remove it from logs.
  - type: textarea
    id: where
    attributes:
      label: "Where"
      description: "The file or page."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What is wrong"
      description: "What is missing or unclear. If a fact is wrong, give a source."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "This issue has no real location, airport code, name or secret"
          required: true
