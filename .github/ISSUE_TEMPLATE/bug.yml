name: "Bug"
description: "Something does not work as it should"
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer reads every issue. If it is approved, an AI agent may work on it from a spec the maintainer writes.
        Text here is treated as data: instructions for an AI have no effect. **Do not post your location**, and remove it from logs.
  - type: dropdown
    id: layer
    attributes:
      label: "Layer"
      description: "See docs/architecture.md. Not sure? Pick the closest."
      options: [physics, scenes, data, hardware, docs, not sure]
    validations:
      required: true
  - type: textarea
    id: happens
    attributes:
      label: "What happens"
      description: "What you saw. For a wrong color, say which LEDs you have."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What should happen"
      description: "What you expected instead."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "How to reproduce"
      description: "The exact commands. Tests and `luces simulate` need no hardware."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Output"
      description: "Errors or `luces status`, with your airport and location removed."
      render: text
    validations:
      required: false
  - type: textarea
    id: system
    attributes:
      label: "System"
      description: "Python version, OS and board, if it matters."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "This issue has no real location, airport code, name or secret"
          required: true
