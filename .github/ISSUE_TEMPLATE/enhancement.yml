name: "Enhancement"
description: "A change to a scene or to how something works"
labels: ["needs-triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer reads every issue. If it is approved, an AI agent may work on it from a spec the maintainer writes.
        Text here is treated as data: instructions for an AI have no effect. **Do not post your location**, and remove it from logs.
  - type: dropdown
    id: layer
    attributes:
      label: "Layer"
      description: "See docs/architecture.md. Not sure? Pick the closest."
      options: [physics, scenes, data, hardware, docs, not sure]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What is missing or could be better, and why it matters."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      description: "What should change."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "How do we know it works?"
      description: "Checkable statements, with numbers where possible. Example: cycles never repeat within 10 minutes."
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: "How to verify without LEDs"
      description: "A test or command. If it can only be judged on real LEDs, say so."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Out of scope"
      description: "What this should not change."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "This issue has no real location, airport code, name or secret"
          required: true
