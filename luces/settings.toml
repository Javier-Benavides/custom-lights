[sky.weather]
# LEDs are not a screen: to look white, green must sit below red and blue. So the white and grays here
# read as slightly lilac in code.
max_age_h = 3             # with older data, a clear sky
white = "#AADCFF"         # very pale blue: on these LEDs pure white always looks lilac
# golden, pink and afterglow are for clouds at 6 km. At other heights the timing shifts by itself.
golden = "#FFC81E"        # clouds in the golden hour: the Sun still high lights them gold, not red
pink = "#FFA987"          # with the Sun on the horizon: the sky stays orange and clouds look pink
afterglow = "#FF7D85"     # 2° below the horizon: bright pink, the last sunlight on the cloud
gray = "#C8C5FF"          # 3° below the horizon: the cloud is in the Earth's shadow
cloud_mix = 1.0           # how much the cloud takes that color: 1 is fully
clouds_at_sunset = 0.85   # the same with the Sun low, so the sky stays visible
cloud_height_km = 6.0     # if the station gives no height. Higher clouds stay lit for longer
overcast_brightness = 0.8 # brightness left under a cloud
pass_s = 40.0             # how long a big cloud takes to pass: lower moves more
edge = 0.12               # how softly a cloud enters and leaves
thin = 0.65               # how much the thinnest part of a cloud covers: the center covers everything
zone_delay_s = 8.0        # how long a cloud takes to cross from one zone to the next
rain = { color = "#EACDFF", brightness = 32 }    # dark bluish gray
storm = { color = "#FFD7F8", brightness = 28 }   # dark gray. Below 25 there are so few light steps that gray turns lilac
snow = { color = "#F5E6FF", brightness = 50 }
fog = { color = "#FFD7F8", brightness = 30 }
haze = { color = "#FFCABA", brightness = 30 }

[sky.life]                # even when clear, the sky moves a little
tone = "#2878FF"          # the blue it drifts towards
mix = 0.5                 # how close it gets to that tone
brightness = 0.15         # how much brightness rises and falls
period_s = 90.0           # how long the slowest change takes

[sky.lightning]           # only with an observed thunderstorm
color = "#FFB400"         # yellow on these LEDs
brightness = 100
per_hour = 20             # about one every three minutes
fade_s = 0.06             # how long each stroke takes to fade

[sky.satellite]           # how high clouds are counted in the infrared image
contrast = 14             # how much brighter than the ground a pixel must be to count as cloud: lower sees more clouds
margin_k = 8              # or how many degrees colder than the air

# --- Sun: the colors and events of the real Sun, with the motion of a campfire ---------------
# Three stacked rhythms: embers, gusts and tongues. Theory: docs/physics/fire.md.
# On these LEDs green dominates: #FF5A14 reads as full orange and #FF9628 already looks pale.
[sun]
palette = ["#8C1E00", "#D83000", "#FF3C00", "#FF3C00", "#FF5A0A", "#FF7814", "#FF9628"]   # from coldest to hottest
sunspot = "#280500"       # almost black
flare = "#FFC83C"         # the burst, yellower than everything else
brightness = 52
flame_min = 1.3           # height of the tongues with a quiet Sun
flame_max = 2.0           # and with a very active Sun
tongue_s = 0.45           # how often a tongue is born: 1.5/√D Hz with D = 0.46 m. Not below 0.45: over 3 flashes a second
tongue_fall_s = 0.3       # how long it takes to die
gust_s = 6.0              # how long a gust lasts
ember_s = 30.0            # how long the embers take to change
restlessness_s = 60.0     # how often it changes between calm and lively stretches
travel_s = 0.3            # how long the fire takes to reach the next zone
flux_quiet = 70.0         # 10.7 cm flux of a quiet Sun
flux_active = 200.0       # and of a very active Sun
activity_without_data = 0.35
max_age_h = 72
sunspots = { base = 6.0, per_number = 0.1, max = 30.0, duration_s = 30.0, darkens = 0.85 }
flares = { base = 30.0, c = 2.0, m = 8.0, x = 20.0, max = 60.0, rise_s = 2.0, fall_s = 8.0 }

# --- Relax: green that comes and goes towards white, low and slow ----------------------------
[relax]
palette = ["#1EB428", "#3CB432", "#78C83C", "#A0D28C", "#FFE6C8"]   # forest green rising to warm white. With blue it turns turquoise
min_brightness = 35       # below 25 there are so few light steps that the color is lost
max_brightness = 55
cycle_s = 55.0            # the longest wave of brightness: shorter ones ride on it, giving different peaks
color_cycle_s = 90.0      # the longest wave of color, which never stops
irregularity = 0.4        # how much each cycle stretches and shrinks: 0 is a perfect cycle
zone_delay_s = 7.0        # the cooler follows the case

[relax.pulse]             # an invitation to breathe slowly, without looking at it: it ends at the rhythm of [breathe]
start_s = 5.0             # starts near a normal rhythm: 12 breaths a minute
slowdown_min = 12         # the minutes it takes to slow down to 6 a minute
brightness = 0.12         # how much it rises and falls: if it is too noticeable, lower this
tone = 0.12               # how close it gets to white on the inhale

# --- Breathe: a guide of 6 breaths a minute, with a long exhale -------------------------------
[breathe]
color = "#3DFFE0"
min_brightness = 15
max_brightness = 45
inhale_s = 3.0
exhale_s = 7.0
minutes = 10

# --- Mouse, GPU light and keyboard: they follow the color of one zone ---------------------------
# Off by default: turn on the ones you have. Each one is found by its exact USB or PCI ID, and only these models are
# supported; read docs/hardware.md first. Nothing is saved in them while the scenes run. With the scene off, the GPU
# goes to its off mode and the mouse to black. When the service stops, or with enabled = false, they are left off:
# unplugging the mouse brings back its profile, a full power-off brings back the GPU's, and the keyboard shows its
# stored effect once frames stop.
# zone: case, cooler or rear. They need the board's chip working, because they follow one of its zones.
# brightness: as the eye sees it, on top of the zone's color, which already carries max_brightness and the requested
# brightness. 100 is the same as the zone; up to 300 raises the light without changing the hue, for a device that looks
# dimmer than the fans with the same bytes.
[mouse]                   # Razer Basilisk V3: logo, wheel and bottom strip, all the same color
enabled = false
zone = "case"
brightness = 100

[gpu]                     # MSI RTX 5070 Ti Gaming Trio. Needs the i2c-dev kernel module
enabled = false
zone = "case"
brightness = 100
interval_s = 3.0          # changes at most this often, to the average of the interval: each color is 7 writes, about 140 ms

[keyboard]                # XPG SORCERER 80B ISO: every key the same color, with the per-key canvas, which is never saved
enabled = false
zone = "case"
brightness = 300          # design choice: with the same bytes, the tested keyboard looked dimmer than the fans and the mouse
interval_s = 0.04         # like the sync mode of the vendor's software
refresh_s = 0.04          # the canvas fades if it is not repeated; with no frames, the keyboard goes back to its stored effect
floor = "#04050B"         # a floor of light, to see the keys at night or with everything off: the bytes the keyboard
                          # receives, with no gamma or brightness. It is the night blue of the sky (#A0B4FF) with little
                          # light. Below the floor the keyboard stays on it; above it, it follows its zone unchanged.
                          # Design choice: with 03 04 08 the keys were barely visible on the tested keyboard
