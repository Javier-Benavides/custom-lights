# luces settings: everything that can change without touching code.
# Edit with `luces settings`. The service rereads it within seconds. If something is wrong it keeps
# the last valid settings, and `luces status` says what failed.
# brightness: 0 to 100, as the eye sees it. colors: #RRGGBB. times: seconds, unless the name says otherwise.
#
# These colors were calibrated by eye on one set of ARGB fans. LEDs are not a screen: expect to retune
# them on yours, see docs/hardware.md.

[general]
initial_scene = "sky"
max_brightness = 70       # current limit for the LEDs, in every scene
gamma = 2.2               # corrects for the eye's response; without it fades look uneven

[zones]
# header: the connector on the board (1, 2 or 3). Check yours with `luces test`.
# leds: how many get painted. Extra ones do nothing.
case = { header = 1, leds = 32 }
cooler = { header = 2, leds = 32 }
# rear = { header = 3, leds = 32 }

[schedule]
# Only for sun and relax. It follows the real Sun, so it shifts by itself between summer and winter.
# They come on at sunrise and go off some hours after sunset. The sky goes off with the real night;
# breathe and color ignore this.
after_sunset_h = 3.0      # how many hours after sunset they go off
on_choose_h = 2.0         # a scene chosen by hand stays on at least this long

# --- Sky: the color comes from the altitude of the Sun, in degrees --------------------------
# Why these stages: docs/physics/twilight.md. The clock time comes from these altitudes, so it changes every day.
# Sunrise and sunset are separate tables because they need not match. The sunrise table assumes mountains
# to the east: the sky lights up long before the Sun is seen. Edit it for your horizon.
# `leds` is the share of LEDs on: at the end the color stays and the LEDs go out one by one.
# Between sky blue and gold there are two dim stages: blue and orange at full brightness blend through white,
# which the real sky never shows.
# With 8 to 10 % blue the gold looked peach: gold goes almost without blue, with green near half of red.
[[sky.sunset]]
altitude = -8.0
color = "#A0B4FF"
brightness = 22
leds = 0.0
stage = "night: the last LED went out"

[[sky.sunset]]
altitude = -5.0
color = "#A0B4FF"
brightness = 22
leds = 1.0
stage = "blue: from here the LEDs go out one by one"

[[sky.sunset]]
altitude = -3.5
color = "#B4BEFF"
